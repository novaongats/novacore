<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NOVA Core v2 — 給与計算エンジン自動テスト</title>
<style>
  body { font-family: 'Segoe UI', 'Noto Sans JP', sans-serif; background: #0f172a; color: #e2e8f0;
         padding: 24px; font-size: 14px; }
  h1 { font-size: 18px; }
  .case { padding: 6px 10px; border-left: 3px solid #334155; margin: 3px 0;
          font-family: Consolas, monospace; font-size: 12.5px; }
  .pass { border-color: #10b981; color: #a7f3d0; }
  .fail { border-color: #ef4444; color: #fecaca; background: rgba(239,68,68,.08); }
  .summary { margin-top: 18px; padding: 14px; border-radius: 8px; font-weight: 700; }
  .ok  { background: #064e3b; }
  .bad { background: #7f1d1d; }
</style>
</head>
<body>
<h1>給与計算エンジン 自動テスト（ゴールデンテスト）</h1>
<p>calc.js / tax-table.js / year-end.js / bonus.js / constants.js の計算ロジックをブラウザ内で直接検証します。
（year-end.js / bonus.js 経由で store.js が読み込まれますが、テスト自体は Firebase 接続不要の純関数のみを対象とします）</p>
<div id="out"></div>

<script type="module">
import {
  calcMonthlyPaycheck, calcBonusPaycheck, getRatesFor,
  getHealthStandard, snapToStandard, roundShakai,
  splitCommuteAllowance, carCommuteCap, getInsuranceStatus,
  ageAttainmentMonth,
  calcHealthPremium, calcPensionPremium, calcChildSupportPremium,
  autoStdBase,
} from '../pages/payroll/calc.js';
import { calcIncomeTaxForMonth, getBonusTaxRateForMonth } from '../pages/payroll/tax-table.js';
import { salaryIncomeDeduction, basicDeduction, calcAnnualTax } from '../pages/payroll/year-end.js';
import { prevMonthTaxBasis, pickPrevMonthRecords } from '../pages/payroll/bonus.js';
import { zenginKana } from '../pages/payroll/banks.js';
import { getIncomeWalls } from '../pages/payroll/constants.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

function eq(label, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  ok ? pass++ : fail++;
  const div = document.createElement('div');
  div.className = 'case ' + (ok ? 'pass' : 'fail');
  div.textContent = `${ok ? '✓' : '✗'} ${label} → ${JSON.stringify(actual)}` +
    (ok ? '' : `（期待値: ${JSON.stringify(expected)}）`);
  out.appendChild(div);
}
function section(title) {
  const h = document.createElement('h3');
  h.textContent = title;
  out.appendChild(h);
}

// ============ 1. 源泉所得税（令和6年表 = 〜2025-12） ============
section('1. 源泉所得税: 令和6年 月額表（〜2025年12月）');
eq('課税対象 87,999円 扶養0', calcIncomeTaxForMonth(87999, 0, '2025-06'), 0);
// 旧NOVACore互換: 境界値ちょうどは下のブラケットに入る（<=判定）
eq('課税対象 88,000円 扶養0（旧版互換の境界仕様）', calcIncomeTaxForMonth(88000, 0, '2025-06'), 0);
eq('課税対象 88,001円 扶養0', calcIncomeTaxForMonth(88001, 0, '2025-06'), 130);
eq('課税対象 167,000円 扶養0', calcIncomeTaxForMonth(167000, 0, '2025-06'), 2290);
eq('課税対象 167,000円 扶養1', calcIncomeTaxForMonth(167000, 1, '2025-06'), 400);
eq('課税対象 300,000円 扶養0', calcIncomeTaxForMonth(300000, 0, '2025-06'), 8920);
eq('課税対象 2,000,001円 扶養0（200万超の算式）',
   calcIncomeTaxForMonth(2000001, 0, '2025-06'), Math.floor(1 * 0.2303) + 178090);
eq('扶養8人（7人の額 −1,610円）',
   calcIncomeTaxForMonth(400000, 8, '2025-06'), 830 - 1610 < 0 ? 0 : 830 - 1610);

// ============ 2. 源泉所得税（令和8年 電算機特例 = 2026-01〜） ============
section('2. 源泉所得税: 令和8年 電算機計算の特例（2026年1月〜）');
// 国税庁PDFの計算例1: 社保控除後 175,000円・扶養2人 → 210円
eq('【国税庁例】175,000円 扶養2', calcIncomeTaxForMonth(175000, 2, '2026-07'), 210);
// 350,000円 扶養0: 給与所得控除106,667 基礎控除48,334 → B=194,999 → ×10.21%−8,296 → 11,610
eq('350,000円 扶養0', calcIncomeTaxForMonth(350000, 0, '2026-07'), 11610);
// 非課税ライン
eq('100,000円 扶養0（課税所得0）', calcIncomeTaxForMonth(100000, 0, '2026-07'), 0);
// 2025-12までは旧表、2026-01からは新方式に切り替わること
eq('年次切替: 2025-12は旧表', calcIncomeTaxForMonth(350000, 0, '2025-12'), 11490);
eq('年次切替: 2026-01は新方式', calcIncomeTaxForMonth(350000, 0, '2026-01'), 11610);

// ============ 3. 社会保険料 ============
section('3. 社会保険料（標準報酬30万円・東京・令和8年度料率）');
eq('健康保険 (9.85%折半)', calcHealthPremium(300000, 9.85), 14775);
eq('厚生年金 (18.3%折半)', calcPensionPremium(300000, 18.3), 27450);
eq('厚生年金の上限 (標報100万→65万でキャップ)', calcPensionPremium(1000000, 18.3), Math.round(650000 * 0.183 / 2));
eq('子育て支援金 (0.23%折半)', calcChildSupportPremium(300000, 0.23), 345);
eq('端数処理: 50銭ちょうどは切捨て', roundShakai(14970.5), 14970);
eq('端数処理: 50銭超は切上げ', roundShakai(14970.51), 14971);

// ============ 4. 標準報酬月額 ============
section('4. 標準報酬月額');
eq('月給30万円 → 30万円(22級)', getHealthStandard(300000), 300000);
eq('月給29.5万円 → 30万円', getHealthStandard(295000), 300000);
eq('逆算スナップ: 厚年27,450円×200÷18.3 → 30万円', snapToStandard(Math.round(27450 * 200 / 18.3)), 300000);

// ============ 5. 通勤手当 ============
section('5. 通勤手当の非課税分離');
eq('公共交通 2万円 → 全額非課税', splitCommuteAllowance(20000, true).nonTaxable, 20000);
eq('公共交通 20万円 → 15万円まで非課税', splitCommuteAllowance(200000, true).nonTaxable, 150000);
// マイカー等: 距離があれば距離段階の上限。片道55km → 55km以上65km未満区分 = 38,700円（令和8年区分）
eq('マイカー 5万円・片道55km → 38,700円まで非課税', splitCommuteAllowance(50000, false, 55).nonTaxable, 38700);
// 距離未入力は非課税限度額を判定できないため安全側=全額課税（旧実装の31,600円上限は過少徴収リスク）
eq('マイカー 5万円・距離未入力 → 非課税0（全額課税）', splitCommuteAllowance(50000, false).nonTaxable, 0);

// ============ 6. 年齢による保険切替（到達日=誕生日の前日 基準） ============
// 法令: 年齢計算ニ関スル法律・民法143条 — 「N歳に達した日」= N歳の誕生日の前日。
// 介護保険(2号): 40歳到達日の属する月から徴収開始、65歳到達日の属する月から徴収終了
//               （協会けんぽ等: 「40歳の誕生日の前日が属する月分から
//                 65歳の誕生日の前日が属する月の前月分まで」）
// 厚生年金: 70歳到達日の属する月から資格喪失（その月の保険料なし）
// 健康保険: 75歳は「誕生日当日」に後期高齢者医療へ移行（誕生月から健保保険料なし）
section('6. 年齢による保険切替（到達日=誕生日の前日が属する月 基準）');
const mkEmp = (birth) => ({ type: 'regular', birthDate: birth, careEligible: false });

// --- 到達月ヘルパー ---
eq('40歳到達月: 月中生まれ 1986-07-15 → 前日7/14 → 2026-07', ageAttainmentMonth('1986-07-15', 40), '2026-07');
eq('40歳到達月: 1日生まれ 1986-08-01 → 前日7/31 → 前月2026-07', ageAttainmentMonth('1986-08-01', 40), '2026-07');
eq('40歳到達月: 月末生まれ 1986-07-31 → 前日7/30 → 2026-07', ageAttainmentMonth('1986-07-31', 40), '2026-07');
eq('75歳は誕生日当日基準: 1951-08-01 → 2026-08', ageAttainmentMonth('1951-08-01', 75, true), '2026-08');
eq('生年月日不正 → null', ageAttainmentMonth('', 40), null);

// --- 介護保険（40歳開始・65歳終了） ---
eq('介護: 40歳到達月の前月はまだ徴収しない（1986-07-15 → 2026-06）', getInsuranceStatus(mkEmp('1986-07-15'), '2026-06').care, false);
eq('介護: 40歳到達月から徴収（1986-07-15 → 2026-07）', getInsuranceStatus(mkEmp('1986-07-15'), '2026-07').care, true);
eq('介護: 8/1生まれは前日7/31到達 → 7月分から徴収（旧15日判定では漏れ）', getInsuranceStatus(mkEmp('1986-08-01'), '2026-07').care, true);
eq('介護: 月末7/31生まれも7月分から徴収（旧15日判定では漏れ）', getInsuranceStatus(mkEmp('1986-07-31'), '2026-07').care, true);
eq('介護: 65歳到達月の前月まで徴収（1961-07-20 → 2026-06）', getInsuranceStatus(mkEmp('1961-07-20'), '2026-06').care, true);
eq('介護: 65歳到達月から徴収終了（1961-07-20 → 2026-07）', getInsuranceStatus(mkEmp('1961-07-20'), '2026-07').care, false);
eq('介護: 8/1生まれの65歳は前日7/31到達 → 7月分から徴収なし', getInsuranceStatus(mkEmp('1961-08-01'), '2026-07').care, false);

// --- 厚生年金（70歳喪失） ---
eq('厚年: 70歳到達月の前月まで（1956-07-10 → 2026-06）', getInsuranceStatus(mkEmp('1956-07-10'), '2026-06').pension, true);
eq('厚年: 70歳到達月から喪失（1956-07-10 → 2026-07）', getInsuranceStatus(mkEmp('1956-07-10'), '2026-07').pension, false);
eq('厚年: 8/1生まれの70歳は前日7/31到達 → 7月から喪失', getInsuranceStatus(mkEmp('1956-08-01'), '2026-07').pension, false);

// --- 健康保険（75歳は誕生日当日基準） ---
eq('健保: 75歳誕生月の前月まで（1951-07-15 → 2026-06）', getInsuranceStatus(mkEmp('1951-07-15'), '2026-06').health, true);
eq('健保: 75歳誕生日の属する月から喪失（1951-07-15 → 2026-07）', getInsuranceStatus(mkEmp('1951-07-15'), '2026-07').health, false);
eq('健保: 8/1生まれの75歳は誕生日当日基準 → 7月はまだ加入（前日基準なら7月喪失になってしまう）',
   getInsuranceStatus(mkEmp('1951-08-01'), '2026-07').health, true);
eq('健保: 同8/1生まれ → 2026-08から喪失', getInsuranceStatus(mkEmp('1951-08-01'), '2026-08').health, false);

eq('生年月日なし → careEligible を尊重',
   getInsuranceStatus({ type: 'regular', careEligible: true }, '2026-07').care, true);

// ============ 7. 料率履歴の解決 ============
section('7. 料率履歴の解決 (getRatesFor)');
const hist = [
  { effectiveDate: '2026-03', health: { tokyo: 9.85 }, employmentEmployee: 0.55 },
  { effectiveDate: '2026-04', health: { tokyo: 9.85 }, employmentEmployee: 0.50 },
];
eq('2026-03 → 3月分レコード', getRatesFor('2026-03', hist).employmentEmployee, 0.55);
eq('2026-07 → 4月分レコード', getRatesFor('2026-07', hist).employmentEmployee, 0.50);
eq('2026-01 → 履歴なし・legacyへフォールバック',
   getRatesFor('2026-01', hist, { employmentEmployee: 0.6 }).employmentEmployee, 0.6);
eq('履歴なし・legacyなし → 既定値', getRatesFor('2026-01', []).pension, 18.3);
// 解決元の監査プロパティ（source）と effectiveDate の形式バリデーション
eq('解決元: 履歴ヒット → history', getRatesFor('2026-07', hist).source, 'history');
eq('解決元: 履歴ヒット時の effectiveDate', getRatesFor('2026-07', hist).effectiveDate, '2026-04');
eq('解決元: legacyフォールバック → legacy', getRatesFor('2026-01', hist, { employmentEmployee: 0.6 }).source, 'legacy');
eq('解決元: 履歴なし・legacyなし → default', getRatesFor('2026-01', []).source, 'default');
eq('effectiveDate が YYYY-MM 形式でない履歴docは無視（console.warn）',
   getRatesFor('2026-07', [{ effectiveDate: '2026/04', pension: 1 }]).pension, 18.3);
eq('不正docを無視しても正しい履歴は解決される',
   getRatesFor('2026-07', [{ effectiveDate: '2026/04', pension: 1 }, ...hist]).employmentEmployee, 0.50);

// ============ 8. 月次給与 end-to-end ============
section('8. 月次給与 end-to-end（正社員・東京・月給30万・扶養0・2026-07）');
const emp1 = { type: 'regular', prefecture: 'tokyo', monthlySalary: 300000,
               dependents: 0, residentTax: 10000, stdRemuneration: 0 };
const rates8 = getRatesFor('2026-07', [
  { effectiveDate: '2026-04', health: { tokyo: 9.85 }, care: 1.62, pension: 18.3,
    employmentEmployee: 0.50, childSupport: 0.23 },
]);
const c1 = calcMonthlyPaycheck(emp1, { month: '2026-07', rates: rates8 });
eq('総支給', c1.gross, 300000);
eq('健康保険', c1.health, 14775);
eq('厚生年金', c1.pension, 27450);
eq('介護保険（対象外）', c1.care, 0);
eq('子育て支援金', c1.childSupport, 345);
eq('雇用保険 (0.5%)', c1.employment, 1500);
eq('社保合計', c1.social, 44070);
eq('課税対象額', c1.taxable, 255930);
eq('所得税', c1.incomeTax, 6340);
eq('差引支給額', c1.net, 300000 - 44070 - 6340 - 10000);

// 支援金の開始月ガード
const c2 = calcMonthlyPaycheck(emp1, { month: '2026-03', rates: rates8 });
eq('2026-03 は支援金0円', c2.childSupport, 0);

// 産休・育休免除
const c3 = calcMonthlyPaycheck({ ...emp1, onChildcareLeave: true }, { month: '2026-07', rates: rates8 });
eq('育休中: 健保・厚年・支援金が0円', c3.health + c3.pension + c3.childSupport, 0);

// 通勤手当（非課税）込み
const emp2 = { ...emp1, commuteAllowanceMonthly: 15000, residentTax: 0 };
const c4 = calcMonthlyPaycheck(emp2, { month: '2026-07', rates: rates8 });
eq('通勤手当込みの総支給', c4.gross, 315000);
eq('課税対象から非課税通勤手当を除外',
   c4.taxable, c4.gross - 15000 - c4.social);

// ============ 9. 賞与 end-to-end ============
section('9. 賞与 end-to-end（2026-07・前月社保控除後255,930円・扶養0）');
eq('賞与税率 (前月255,930円→4.084%)', getBonusTaxRateForMonth(255930, 0, '2026-07'), 0.04084);
eq('賞与税率 (前月260,000円→6.126%)', getBonusTaxRateForMonth(260000, 0, '2026-07'), 0.06126);
eq('賞与税率 扶養3 (前月299,999円→2.042%)', getBonusTaxRateForMonth(299999, 3, '2026-07'), 0.02042);
eq('賞与税率 扶養3 (前月300,000円→4.084%・以上判定)', getBonusTaxRateForMonth(300000, 3, '2026-07'), 0.04084);
const b1 = calcBonusPaycheck(emp1, {
  month: '2026-07', amount: 500000, prevMonthAfterSocial: 255930, rates: rates8,
});
eq('賞与: 健康保険', b1.health, 24625);
eq('賞与: 厚生年金', b1.pension, 45750);
eq('賞与: 支援金', b1.childSupport, 575);
eq('賞与: 雇用保険', b1.employment, 2500);
eq('賞与: 所得税', b1.incomeTax, Math.floor((500000 - 73450) * 0.04084));
eq('賞与: 1000円未満切捨て (500,999円→標準賞与50万)',
   calcBonusPaycheck(emp1, { month: '2026-07', amount: 500999, prevMonthAfterSocial: 255930, rates: rates8 }).health,
   24625);
eq('賞与: 前月レコードあり・10倍以内 → 率方式（specialCalc=null）', b1.specialCalc, null);

// ---- 前月給与なしの特殊計算（所得税法186条: (賞与−社保)÷6 を月額表適用 ×6） ----
// 手検算1（令和8年電算機特例・アルバイト=社保なし・扶養0・賞与180万）:
//   (1,800,000 − 0) ÷ 6 = 300,000
//   給与所得控除月割 ceil(300,000×0.20+36,667)=96,667 / 基礎控除月割 48,334
//   B = 300,000−96,667−48,334 = 154,999 → 154,999×5.105% = 7,912.699 → 10円未満四捨五入 7,910
//   賞与源泉 = 7,910 × 6 = 47,460
const empNoIns = { type: 'arbeit', dependents: 0 };
const bs1 = calcBonusPaycheck(empNoIns, {
  month: '2026-07', amount: 1800000, prevMonthAfterSocial: 0, hasPrevRecord: false, rates: rates8,
});
eq('賞与特殊計算: 前月なし・180万・扶養0（2026-07）', bs1.incomeTax, 47460);
eq('賞与特殊計算: specialCalc 種別 = no-prev', bs1.specialCalc, 'no-prev');
// 手検算2（令和6年月額表・アルバイト・扶養1・賞与120万）:
//   1,200,000 ÷ 6 = 200,000 → 月額表（〜200,000円・扶養1人）= 1,920 → ×6 = 11,520
const bs2 = calcBonusPaycheck({ type: 'arbeit', dependents: 1 }, {
  month: '2025-07', amount: 1200000, prevMonthAfterSocial: 0, hasPrevRecord: false, rates: rates8,
});
eq('賞与特殊計算: 前月なし・120万・扶養1（2025-07 旧月額表）', bs2.incomeTax, 11520);
// 手検算3（社保あり・正社員東京・扶養0・賞与50万・前月なし）:
//   社保 = 24,625+45,750+575+2,500 = 73,450 → (500,000−73,450)÷6 = 71,091（円未満切捨て）
//   71,091 ≤ 158,333 → 控除計 54,167+48,334 > 71,091 → B=0 → 税額0 → ×6 = 0
const bs3 = calcBonusPaycheck(emp1, {
  month: '2026-07', amount: 500000, prevMonthAfterSocial: 0, hasPrevRecord: false, rates: rates8,
});
eq('賞与特殊計算: 低額賞与は月額換算で非課税ライン以下 → 0円', bs3.incomeTax, 0);
eq('賞与特殊計算: 社保は通常どおり控除', bs3.social, 73450);

// ---- 前月給与の10倍超の特殊計算（所得税法186条・国税庁タックスアンサーNo.2523） ----
// 税額 = ( 月額表税額((賞与−社保)÷6＋前月社保控除後給与) − 月額表税額(前月社保控除後給与) ) × 6
// 手検算4（2026-07・正社員東京・扶養0・賞与300万・前月社保控除後255,930円）:
//   賞与の社保: 健保 3,000,000×9.85%÷2=147,750 / 厚年 min(300万,150万)×18.3%÷2=137,250
//              / 支援金 3,000,000×0.23%÷2=3,450 / 雇用 3,000,000×0.5%=15,000 → 計303,450
//   賞与−社保 = 2,696,550 ＞ 前月255,930×10=2,559,300 → 10倍超で特殊計算
//   (賞与−社保)÷6 = 449,425（1円未満切捨て）
//   月額表（令和8年電算機特例・甲欄）:
//    T(449,425+255,930=705,355): 給与所得控除 ceil(705,355×10%+91,667)=162,203
//      基礎控除48,334 → B=705,355−162,203−48,334=494,818
//      → 494,818×20.42%−36,374=64,667.8… → 10円未満四捨五入 64,670
//    T(255,930): 控除 ceil(255,930×30%+6,667)=83,446 +48,334 → B=124,150
//      → 124,150×5.105%=6,337.86 → 6,340（セクション8の月次所得税と同値）
//   税額 = (64,670−6,340)×6 = 349,980
const b10 = calcBonusPaycheck(emp1, {
  month: '2026-07', amount: 3000000, prevMonthAfterSocial: 255930, rates: rates8,
});
eq('賞与10倍超: specialCalc = over-10x', b10.specialCalc, 'over-10x');
eq('賞与10倍超: 社保合計', b10.social, 303450);
eq('賞与10倍超: 所得税（月額表差額×6）', b10.incomeTax, 349980);
// 手検算5（境界値: ちょうど10倍は「超える」に当たらず率方式のまま）
//   アルバイト（社保なし）・扶養0・前月100,000円:
//   賞与1,000,000円（=10倍ちょうど）→ 率方式。前月10万円の算出率=4.084%
//     （令和8年算出率表: 94千円以上 → 4.084%）→ floor(1,000,000×0.04084)
eq('賞与=前月×10ちょうど → 率方式のまま', calcBonusPaycheck(empNoIns, {
  month: '2026-07', amount: 1000000, prevMonthAfterSocial: 100000, rates: rates8,
}).specialCalc, null);
eq('賞与=前月×10ちょうど → 率方式の税額', calcBonusPaycheck(empNoIns, {
  month: '2026-07', amount: 1000000, prevMonthAfterSocial: 100000, rates: rates8,
}).incomeTax, Math.floor(1000000 * 0.04084));
// 手検算6（10倍を1円超えたら特殊計算に切替・2026-07・扶養0・社保なし）:
//   1,000,001÷6 = 166,666（1円未満切捨て）
//   T(166,666+100,000=266,666): 控除 ceil(266,666×30%+6,667)=86,667 +48,334 → B=131,665
//     → 131,665×5.105%=6,721.50 → 10円未満四捨五入 6,720
//   T(100,000): 控除54,167+48,334 ＞ 100,000 → B=0 → 税額0
//   税額 = (6,720−0)×6 = 40,320
const b10b = calcBonusPaycheck(empNoIns, {
  month: '2026-07', amount: 1000001, prevMonthAfterSocial: 100000, rates: rates8,
});
eq('賞与>前月×10（1円超過）→ specialCalc = over-10x', b10b.specialCalc, 'over-10x');
eq('賞与>前月×10 → 特殊計算の税額 40,320円', b10b.incomeTax, 40320);
// 手検算7（令和6年月額表・2025-07・扶養0・社保なし・前月80,000円・賞与900,000円）:
//   900,000 ＞ 80,000×10 → 特殊計算。900,000÷6=150,000
//   T(150,000+80,000=230,000) = 5,310（令和6年月額表 甲欄・扶養0、225,000超230,000以下の行）
//   T(80,000) = 0（88,000円未満）→ 税額 = (5,310−0)×6 = 31,860
const b10c = calcBonusPaycheck(empNoIns, {
  month: '2025-07', amount: 900000, prevMonthAfterSocial: 80000, rates: rates8,
});
eq('賞与10倍超（令和6年月額表・2025-07）→ 31,860円', b10c.incomeTax, 31860);
eq('賞与10倍超（令和6年表）: specialCalc = over-10x', b10c.specialCalc, 'over-10x');

// ============ 10. 年末調整: 年度別パラメータ（令和7年度・令和8年度税制改正） ============
section('10. 年末調整: 給与所得控除・基礎控除の年度切替（令和7年度・令和8年度税制改正）');
// 給与所得控除の最低保障: 〜2024=55万 / 2025=65万 / 2026・2027=74万（令和8年度改正、本則69万+特例5万）
// 出典: 国税庁 https://www.nta.go.jp/users/gensen/2025kiso/ ・ https://www.nta.go.jp/users/gensen/2026kiso/index.htm
eq('給与所得控除 収入100万 (2024年分)', salaryIncomeDeduction(1000000, 2024), 550000);
eq('給与所得控除 収入100万 (2025年分→最低65万)', salaryIncomeDeduction(1000000, 2025), 650000);
eq('給与所得控除 収入170万 (2024年分)', salaryIncomeDeduction(1700000, 2024), 580000);
eq('給与所得控除 収入170万 (2025年分→65万に底上げ)', salaryIncomeDeduction(1700000, 2025), 650000);
eq('給与所得控除 収入190万 (2025年分: 一律65万の上端)', salaryIncomeDeduction(1900000, 2025), 650000);
eq('給与所得控除 収入200万 (2025年分: 表引き 0.3y+8万相当)', salaryIncomeDeduction(2000000, 2025), 680000);

// --- 表引き（所得税法別表第五）方式: A = 収入÷4 の千円未満切捨て を基準にした区分算式 ---
// 手検算: 収入1,701,000 (2024年分) → A=425,000 → 控除後 425,000×2.4+100,000=1,120,000 → 控除581,000
//        （旧・速算式では 1,701,000×40%−100,000=580,400 となり表と1,000円未満の端数がズレていた）
eq('給与所得控除 収入170.1万 (2024年分・表引き)', salaryIncomeDeduction(1701000, 2024), 581000);
// 固定額帯（別表第五）: 収入1,619,000〜1,619,999円 → 控除後の金額 1,069,000円
eq('給与所得控除 収入1,619,500 (2024年分・固定額帯 → 控除後106.9万)',
   salaryIncomeDeduction(1619500, 2024), 1619500 - 1069000);
// 手検算: 収入3,001,000 (2025年分) → A=750,000 → 控除後 750,000×2.8−80,000=2,020,000 → 控除981,000
eq('給与所得控除 収入300.1万 (2025年分・表引き)', salaryIncomeDeduction(3001000, 2025), 981000);
// 660万円以上は表の適用外・速算式（収入×10%+110万）
eq('給与所得控除 収入700万 (速算式)', salaryIncomeDeduction(7000000, 2025), 1800000);

// --- 令和8年度改正（2026・2027年分）: 最低保障74万円 ---
// 手検算: 収入220万円未満は一律74万円（74万円ゾーン）。
//   収入2,189,999 → 控除後 = 収入−740,000 / 収入2,190,000〜2,199,999 → 控除後1,450,000（固定額帯）
//   収入2,200,000 → A=550,000 → 控除後 550,000×2.8−80,000=1,460,000 → 控除740,000
eq('給与所得控除 収入100万 (2026年分→最低74万)', salaryIncomeDeduction(1000000, 2026), 740000);
eq('給与所得控除 収入2,189,999 (2026年分: 74万円ゾーン上端)', salaryIncomeDeduction(2189999, 2026), 740000);
eq('給与所得控除 収入219.5万 (2026年分: 固定額帯 → 控除後145万)', salaryIncomeDeduction(2195000, 2026), 2195000 - 1450000);
eq('給与所得控除 収入220万 (2026年分: A方式へ移行)', salaryIncomeDeduction(2200000, 2026), 740000);
eq('給与所得控除 収入300万 (2026年分: 表引き98万)', salaryIncomeDeduction(3000000, 2026), 980000);
eq('給与所得控除 2027年分も特例74万を継続', salaryIncomeDeduction(1000000, 2027), 740000);
// 2028年分以降は特例終了で本則69万（物価連動見直しの公表待ち・暫定）
eq('給与所得控除 収入100万 (2028年分→本則69万・暫定)', salaryIncomeDeduction(1000000, 2028), 690000);

// --- 基礎控除 ---
// 2025年分（令和7年度改正）: 95万〜58万の段階
eq('基礎控除 所得132万以下 (2025)', basicDeduction(1320000, 2025), 950000);
eq('基礎控除 所得132万超 (2025→88万)', basicDeduction(1320001, 2025), 880000);
eq('基礎控除 所得336万超 (2025→68万)', basicDeduction(3360001, 2025), 680000);
eq('基礎控除 所得489万超 (2025→63万)', basicDeduction(4890001, 2025), 630000);
eq('基礎控除 所得655万超 (2025→58万)', basicDeduction(6550001, 2025), 580000);
eq('基礎控除 所得2350万超 (2025→従来の逓減48万)', basicDeduction(23600000, 2025), 480000);
eq('基礎控除 (2024→旧48万)', basicDeduction(5000000, 2024), 480000);
// 2026・2027年分（令和8年度改正）: 本則62万+特例上乗せ。

eq('基礎控除 所得132万以下 (2026→104万)', basicDeduction(1320000, 2026), 1040000);
eq('基礎控除 所得489万以下 (2026→104万・区分は一本化)', basicDeduction(4890000, 2026), 1040000);
eq('基礎控除 所得489万超 (2026→67万)', basicDeduction(4890001, 2026), 670000);
eq('基礎控除 所得655万超 (2026→62万)', basicDeduction(6550001, 2026), 620000);
eq('基礎控除 所得2350万以下の上端 (2026→62万)', basicDeduction(23500000, 2026), 620000);
eq('基礎控除 所得2350万超 (2026→従来の逓減48万)', basicDeduction(23600000, 2026), 480000);
eq('基礎控除 2027年分も特例継続 (→104万)', basicDeduction(1320001, 2027), 1040000);
// 2028年分（令和10年分）以降: 特例終了。132万以下99万（62万+37万恒久）/ 2,350万以下62万（暫定）
eq('基礎控除 所得132万以下 (2028→99万)', basicDeduction(1320000, 2028), 990000);
eq('基礎控除 所得132万超 (2028→62万)', basicDeduction(1320001, 2028), 620000);
// 年税額 end-to-end（年収300万・社保44万・扶養1人）
// 法定手順の手検算:
//   2025年分: 給与所得控除 300万×0.3+8万=98万 → 給与所得202万
//     課税所得 = 202万−44万−基礎88万−扶養38万 = 32万（1,000円未満切捨て後も32万）
//     算出所得税 32万×5% = 16,000 → 年調年税額 16,000×102.1% = 16,336 → 100円未満切捨て = 16,300
eq('年税額 2025年分（102.1%の100円未満切捨て）', calcAnnualTax(3000000, 440000, 1, 2025).totalTax, 16300);
//   2024年分: 課税所得 = 202万−44万−基礎48万−扶養38万 = 72万
//     算出所得税 72万×5% = 36,000 → 36,000×102.1% = 36,756 → 100円未満切捨て = 36,700
eq('年税額 2024年分（基礎控除48万）', calcAnnualTax(3000000, 440000, 1, 2024).totalTax, 36700);
//   課税所得の1,000円未満切捨て: 社保440,500円 → 課税所得319,500 → 319,000
//     算出所得税 319,000×5% = 15,950 → ×102.1% = 16,284.95 → 100円未満切捨て = 16,200
eq('課税所得の1,000円未満切捨て', calcAnnualTax(3000000, 440500, 1, 2025).taxable, 319000);
eq('年税額（両端数処理の複合）', calcAnnualTax(3000000, 440500, 1, 2025).totalTax, 16200);
//   2026年分（令和8年度改正）: 年収300万・社保44万・扶養1人
//     給与所得控除 98万（A=750,000 → 控除後202万） → 給与所得202万
//     課税所得 = 202万−44万−基礎控除104万−扶養38万 = 16万
//     算出所得税 16万×5% = 8,000 → ×102.1% = 8,168 → 100円未満切捨て = 8,100
eq('年税額 2026年分（令和8年度改正・基礎控除104万）', calcAnnualTax(3000000, 440000, 1, 2026).totalTax, 8100);
//   給与所得の下限0: 収入50万（控除後0円） → 給与所得0・税額0
eq('給与所得は下限0（収入が控除未満）', calcAnnualTax(500000, 0, 0, 2026).income, 0);
eq('給与所得0なら年税額も0', calcAnnualTax(500000, 0, 0, 2026).totalTax, 0);
