<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NOVA Core v2 — 給与計算エンジン自動テスト</title>
<style>
  body { font-family: 'Segoe UI', 'Noto Sans JP', sans-serif; background: #0f172a; color: #e2e8f0;
         padding: 24px; font-size: 14px; }
  h1 { font-size: 18px; }
  .case { padding: 6px 10px; border-left: 3px solid #334155; margin: 3px 0;
          font-family: Consolas, monospace; font-size: 12.5px; }
  .pass { border-color: #10b981; color: #a7f3d0; }
  .fail { border-color: #ef4444; color: #fecaca; background: rgba(239,68,68,.08); }
  .summary { margin-top: 18px; padding: 14px; border-radius: 8px; font-weight: 700; }
  .ok  { background: #064e3b; }
  .bad { background: #7f1d1d; }
</style>
</head>
<body>
<h1>給与計算エンジン 自動テスト（ゴールデンテスト）</h1>
<p>calc.js / tax-table.js / year-end.js / bonus.js / constants.js の計算ロジックをブラウザ内で直接検証します。
（year-end.js / bonus.js 経由で store.js が読み込まれますが、テスト自体は Firebase 接続不要の純関数のみを対象とします）</p>
<div id="out"></div>

<script type="module">
import {
  calcMonthlyPaycheck, calcBonusPaycheck, getRatesFor,
  getHealthStandard, snapToStandard, roundShakai,
  splitCommuteAllowance, carCommuteCap, getInsuranceStatus,
  calcHealthPremium, calcPensionPremium, calcChildSupportPremium,
  autoStdBase,
} from '../pages/payroll/calc.js';
import { calcIncomeTaxForMonth, getBonusTaxRateForMonth } from '../pages/payroll/tax-table.js';
import { salaryIncomeDeduction, basicDeduction, calcAnnualTax } from '../pages/payroll/year-end.js';
import { prevMonthTaxBasis, pickPrevMonthRecords } from '../pages/payroll/bonus.js';
import { zenginKana } from '../pages/payroll/banks.js';
import { getIncomeWalls } from '../pages/payroll/constants.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

function eq(label, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  ok ? pass++ : fail++;
  const div = document.createElement('div');
  div.className = 'case ' + (ok ? 'pass' : 'fail');
  div.textContent = `${ok ? '✓' : '✗'} ${label} → ${JSON.stringify(actual)}` +
    (ok ? '' : `（期待値: ${JSON.stringify(expected)}）`);
  out.appendChild(div);
}
function section(title) {
  const h = document.createElement('h3');
  h.textContent = title;
  out.appendChild(h);
}

// ============ 1. 源泉所得税（令和6年表 = 〜2025-12） ============
section('1. 源泉所得税: 令和6年 月額表（〜2025年12月）');
eq('課税対象 87,999円 扶養0', calcIncomeTaxForMonth(87999, 0, '2025-06'), 0);
// 旧NOVACore互換: 境界値ちょうどは下のブラケットに入る（<=判定）
eq('課税対象 88,000円 扶養0（旧版互換の境界仕様）', calcIncomeTaxForMonth(88000, 0, '2025-06'), 0);
eq('課税対象 88,001円 扶養0', calcIncomeTaxForMonth(88001, 0, '2025-06'), 130);
eq('課税対象 167,000円 扶養0', calcIncomeTaxForMonth(167000, 0, '2025-06'), 2290);
eq('課税対象 167,000円 扶養1', calcIncomeTaxForMonth(167000, 1, '2025-06'), 400);
eq('課税対象 300,000円 扶養0', calcIncomeTaxForMonth(300000, 0, '2025-06'), 8920);
eq('課税対象 2,000,001円 扶養0（200万超の算式）',
   calcIncomeTaxForMonth(2000001, 0, '2025-06'), Math.floor(1 * 0.2303) + 178090);
eq('扶養8人（7人の額 −1,610円）',
   calcIncomeTaxForMonth(400000, 8, '2025-06'), 830 - 1610 < 0 ? 0 : 830 - 1610);

// ============ 2. 源泉所得税（令和8年 電算機特例 = 2026-01〜） ============
section('2. 源泉所得税: 令和8年 電算機計算の特例（2026年1月〜）');
// 国税庁PDFの計算例1: 社保控除後 175,000円・扶養2人 → 210円
eq('【国税庁例】175,000円 扶養2', calcIncomeTaxForMonth(175000, 2, '2026-07'), 210);
// 350,000円 扶養0: 給与所得控除106,667 基礎控除48,334 → B=194,999 → ×10.21%−8,296 → 11,610
eq('350,000円 扶養0', calcIncomeTaxForMonth(350000, 0, '2026-07'), 11610);
// 非課税ライン
eq('100,000円 扶養0（課税所得0）', calcIncomeTaxForMonth(100000, 0, '2026-07'), 0);
// 2025-12までは旧表、2026-01からは新方式に切り替わること
eq('年次切替: 2025-12は旧表', calcIncomeTaxForMonth(350000, 0, '2025-12'), 11490);
eq('年次切替: 2026-01は新方式', calcIncomeTaxForMonth(350000, 0, '2026-01'), 11610);

// ============ 3. 社会保険料 ============
section('3. 社会保険料（標準報酬30万円・東京・令和8年度料率）');
eq('健康保険 (9.85%折半)', calcHealthPremium(300000, 9.85), 14775);
eq('厚生年金 (18.3%折半)', calcPensionPremium(300000, 18.3), 27450);
eq('厚生年金の上限 (標報100万→65万でキャップ)', calcPensionPremium(1000000, 18.3), Math.round(650000 * 0.183 / 2));
eq('子育て支援金 (0.23%折半)', calcChildSupportPremium(300000, 0.23), 345);
eq('端数処理: 50銭ちょうどは切捨て', roundShakai(14970.5), 14970);
eq('端数処理: 50銭超は切上げ', roundShakai(14970.51), 14971);

// ============ 4. 標準報酬月額 ============
section('4. 標準報酬月額');
eq('月給30万円 → 30万円(22級)', getHealthStandard(300000), 300000);
eq('月給29.5万円 → 30万円', getHealthStandard(295000), 300000);
eq('逆算スナップ: 厚年27,450円×200÷18.3 → 30万円', snapToStandard(Math.round(27450 * 200 / 18.3)), 300000);

// ============ 5. 通勤手当 ============
section('5. 通勤手当の非課税分離');
eq('公共交通 2万円 → 全額非課税', splitCommuteAllowance(20000, true).nonTaxable, 20000);
eq('公共交通 20万円 → 15万円まで非課税', splitCommuteAllowance(200000, true).nonTaxable, 150000);
eq('マイカー 5万円 → 31,600円まで非課税', splitCommuteAllowance(50000, false).nonTaxable, 31600);

// ============ 6. 年齢による保険切替 ============
section('6. 年齢による保険切替（2026-07時点）');
const mkEmp = (birth) => ({ type: 'regular', birthDate: birth, careEligible: false });
eq('45歳 → 介護保険 自動適用', getInsuranceStatus(mkEmp('1981-01-01'), '2026-07').care, true);
eq('30歳 → 介護保険なし', getInsuranceStatus(mkEmp('1996-01-01'), '2026-07').care, false);
eq('70歳 → 厚生年金 喪失', getInsuranceStatus(mkEmp('1956-01-01'), '2026-07').pension, false);
eq('76歳 → 健康保険 喪失', getInsuranceStatus(mkEmp('1950-01-01'), '2026-07').health, false);
eq('生年月日なし → careEligible を尊重',
   getInsuranceStatus({ type: 'regular', careEligible: true }, '2026-07').care, true);

// ============ 7. 料率履歴の解決 ============
section('7. 料率履歴の解決 (getRatesFor)');
const hist = [
  { effectiveDate: '2026-03', health: { tokyo: 9.85 }, employmentEmployee: 0.55 },
  { effectiveDate: '2026-04', health: { tokyo: 9.85 }, employmentEmployee: 0.50 },
];
eq('2026-03 → 3月分レコード', getRatesFor('2026-03', hist).employmentEmployee, 0.55);
eq('2026-07 → 4月分レコード', getRatesFor('2026-07', hist).employmentEmployee, 0.50);
eq('2026-01 → 履歴なし・legacyへフォールバック',
   getRatesFor('2026-01', hist, { employmentEmployee: 0.6 }).employmentEmployee, 0.6);
eq('履歴なし・legacyなし → 既定値', getRatesFor('2026-01', []).pension, 18.3);

// ============ 8. 月次給与 end-to-end ============
section('8. 月次給与 end-to-end（正社員・東京・月給30万・扶養0・2026-07）');
const emp1 = { type: 'regular', prefecture: 'tokyo', monthlySalary: 300000,
               dependents: 0, residentTax: 10000, stdRemuneration: 0 };
const rates8 = getRatesFor('2026-07', [
  { effectiveDate: '2026-04', health: { tokyo: 9.85 }, care: 1.62, pension: 18.3,
    employmentEmployee: 0.50, childSupport: 0.23 },
]);
const c1 = calcMonthlyPaycheck(emp1, { month: '2026-07', rates: rates8 });
eq('総支給', c1.gross, 300000);
eq('健康保険', c1.health, 14775);
eq('厚生年金', c1.pension, 27450);
eq('介護保険（対象外）', c1.care, 0);
eq('子育て支援金', c1.childSupport, 345);
eq('雇用保険 (0.5%)', c1.employment, 1500);
eq('社保合計', c1.social, 44070);
eq('課税対象額', c1.taxable, 255930);
eq('所得税', c1.incomeTax, 6340);
eq('差引支給額', c1.net, 300000 - 44070 - 6340 - 10000);

// 支援金の開始月ガード
const c2 = calcMonthlyPaycheck(emp1, { month: '2026-03', rates: rates8 });
eq('2026-03 は支援金0円', c2.childSupport, 0);

// 産休・育休免除
const c3 = calcMonthlyPaycheck({ ...emp1, onChildcareLeave: true }, { month: '2026-07', rates: rates8 });
eq('育休中: 健保・厚年・支援金が0円', c3.health + c3.pension + c3.childSupport, 0);

// 通勤手当（非課税）込み
const emp2 = { ...emp1, commuteAllowanceMonthly: 15000, residentTax: 0 };
const c4 = calcMonthlyPaycheck(emp2, { month: '2026-07', rates: rates8 });
eq('通勤手当込みの総支給', c4.gross, 315000);
eq('課税対象から非課税通勤手当を除外',
   c4.taxable, c4.gross - 15000 - c4.social);

// ============ 9. 賞与 end-to-end ============
section('9. 賞与 end-to-end（2026-07・前月社保控除後255,930円・扶養0）');
eq('賞与税率 (前月255,930円→4.084%)', getBonusTaxRateForMonth(255930, 0, '2026-07'), 0.04084);
eq('賞与税率 (前月260,000円→6.126%)', getBonusTaxRateForMonth(260000, 0, '2026-07'), 0.06126);
eq('賞与税率 扶養3 (前月299,999円→2.042%)', getBonusTaxRateForMonth(299999, 3, '2026-07'), 0.02042);
eq('賞与税率 扶養3 (前月300,000円→4.084%・以上判定)', getBonusTaxRateForMonth(300000, 3, '2026-07'), 0.04084);
const b1 = calcBonusPaycheck(emp1, {
  month: '2026-07', amount: 500000, prevMonthAfterSocial: 255930, rates: rates8,
});
eq('賞与: 健康保険', b1.health, 24625);
eq('賞与: 厚生年金', b1.pension, 45750);
eq('賞与: 支援金', b1.childSupport, 575);
eq('賞与: 雇用保険', b1.employment, 2500);
eq('賞与: 所得税', b1.incomeTax, Math.floor((500000 - 73450) * 0.04084));
eq('賞与: 1000円未満切捨て (500,999円→標準賞与50万)',
   calcBonusPaycheck(emp1, { month: '2026-07', amount: 500999, prevMonthAfterSocial: 255930, rates: rates8 }).health,
   24625);
eq('賞与: 前月レコードあり → 率方式（specialCalc=false）', b1.specialCalc, false);

// ---- 前月給与なしの特殊計算（所得税法186条: (賞与−社保)÷6 を月額表適用 ×6） ----
// 手検算1（令和8年電算機特例・アルバイト=社保なし・扶養0・賞与180万）:
//   (1,800,000 − 0) ÷ 6 = 300,000
//   給与所得控除月割 ceil(300,000×0.20+36,667)=96,667 / 基礎控除月割 48,334
//   B = 300,000−96,667−48,334 = 154,999 → 154,999×5.105% = 7,912.699 → 10円未満四捨五入 7,910
//   賞与源泉 = 7,910 × 6 = 47,460
const empNoIns = { type: 'arbeit', dependents: 0 };
const bs1 = calcBonusPaycheck(empNoIns, {
  month: '2026-07', amount: 1800000, prevMonthAfterSocial: 0, hasPrevRecord: false, rates: rates8,
});
eq('賞与特殊計算: 前月なし・180万・扶養0（2026-07）', bs1.incomeTax, 47460);
eq('賞与特殊計算: specialCalc フラグ', bs1.specialCalc, true);
// 手検算2（令和6年月額表・アルバイト・扶養1・賞与120万）:
//   1,200,000 ÷ 6 = 200,000 → 月額表（〜200,000円・扶養1人）= 1,920 → ×6 = 11,520
const bs2 = calcBonusPaycheck({ type: 'arbeit', dependents: 1 }, {
  month: '2025-07', amount: 1200000, prevMonthAfterSocial: 0, hasPrevRecord: false, rates: rates8,
});
eq('賞与特殊計算: 前月なし・120万・扶養1（2025-07 旧月額表）', bs2.incomeTax, 11520);
// 手検算3（社保あり・正社員東京・扶養0・賞与50万・前月なし）:
//   社保 = 24,625+45,750+575+2,500 = 73,450 → (500,000−73,450)÷6 = 71,091（円未満切捨て）
//   71,091 ≤ 158,333 → 控除計 54,167+48,334 > 71,091 → B=0 → 税額0 → ×6 = 0
const bs3 = calcBonusPaycheck(emp1, {
  month: '2026-07', amount: 500000, prevMonthAfterSocial: 0, hasPrevRecord: false, rates: rates8,
});
eq('賞与特殊計算: 低額賞与は月額換算で非課税ライン以下 → 0円', bs3.incomeTax, 0);
eq('賞与特殊計算: 社保は通常どおり控除', bs3.social, 73450);

// ============ 10. 年末調整: 年度別パラメータ（令和7年度税制改正） ============
section('10. 年末調整: 給与所得控除・基礎控除の年度切替（令和7年度税制改正）');
// 給与所得控除の最低保障: 〜2024=55万 / 2025〜=65万（収入190万円以下は実質65万）
eq('給与所得控除 収入100万 (2024年分)', salaryIncomeDeduction(1000000, 2024), 550000);
eq('給与所得控除 収入100万 (2025年分→最低65万)', salaryIncomeDeduction(1000000, 2025), 650000);
eq('給与所得控除 収入170万 (2024年分: 0.4y−10万)', salaryIncomeDeduction(1700000, 2024), 580000);
eq('給与所得控除 収入170万 (2025年分→65万に底上げ)', salaryIncomeDeduction(1700000, 2025), 650000);
eq('給与所得控除 収入190万 (2025年分: 実質65万の上端)', salaryIncomeDeduction(1900000, 2025), 650000);
eq('給与所得控除 収入200万 (2025年分: 0.3y+8万=68万で底を超える)', salaryIncomeDeduction(2000000, 2025), 680000);
// 基礎控除: 合計所得金額に応じた段階（88/68/63万の上乗せは令和7・8年分限定）
eq('基礎控除 所得132万以下 (2025)', basicDeduction(1320000, 2025), 950000);
eq('基礎控除 所得132万超 (2025→88万)', basicDeduction(1320001, 2025), 880000);
eq('基礎控除 所得336万超 (2025→68万)', basicDeduction(3360001, 2025), 680000);
eq('基礎控除 所得489万超 (2025→63万)', basicDeduction(4890001, 2025), 630000);
eq('基礎控除 所得655万超 (2025→58万)', basicDeduction(6550001, 2025), 580000);
eq('基礎控除 所得2350万超 (2025→従来の逓減48万)', basicDeduction(23600000, 2025), 480000);
eq('基礎控除 所得132万超 (2027→上乗せ終了で58万)', basicDeduction(1320001, 2027), 580000);
eq('基礎控除 所得132万以下 (2027→95万は恒久)', basicDeduction(1320000, 2027), 950000);
eq('基礎控除 (2024→旧48万)', basicDeduction(5000000, 2024), 480000);
// 年税額 end-to-end（年収300万・社保44万・扶養1人）
// 法定手順の手検算:
//   2025年分: 給与所得控除 300万×0.3+8万=98万 → 給与所得202万
//     課税所得 = 202万−44万−基礎88万−扶養38万 = 32万（1,000円未満切捨て後も32万）
//     算出所得税 32万×5% = 16,000 → 年調年税額 16,000×102.1% = 16,336 → 100円未満切捨て = 16,300
eq('年税額 2025年分（102.1%の100円未満切捨て）', calcAnnualTax(3000000, 440000, 1, 2025).totalTax, 16300);
//   2024年分: 課税所得 = 202万−44万−基礎48万−扶養38万 = 72万
//     算出所得税 72万×5% = 36,000 → 36,000×102.1% = 36,756 → 100円未満切捨て = 36,700
eq('年税額 2024年分（基礎控除48万）', calcAnnualTax(3000000, 440000, 1, 2024).totalTax, 36700);
//   課税所得の1,000円未満切捨て: 社保440,500円 → 課税所得319,500 → 319,000
//     算出所得税 319,000×5% = 15,950 → ×102.1% = 16,284.95 → 100円未満切捨て = 16,200
eq('課税所得の1,000円未満切捨て', calcAnnualTax(3000000, 440500, 1, 2025).taxable, 319000);
eq('年税額（両端数処理の複合）', calcAnnualTax(3000000, 440500, 1, 2025).totalTax, 16200);

// ============ 11. 賞与: 前月給与の参照と課税ベース ============
section('11. 賞与: 前月レコードの選択と税率基礎額');
// 税率基礎額 = 前月の「社保控除後の給与等」= rec.taxable（非課税通勤手当除外済み）
eq('taxable があればそのまま使う', prevMonthTaxBasis({ taxable: 255930, gross: 315000, social: 44070 }), 255930);
eq('taxable の無い旧データは gross−非課税通勤−社保',
   prevMonthTaxBasis({ gross: 315000, commuteNonTaxable: 15000, social: 44070 }), 255930);
eq('レコード無し → 0', prevMonthTaxBasis(null), 0);
// 賞与月より前の月のうち最新のレコードを選ぶ（未来月・当月は使わない）
const bonusRecs = [
  { empId: 'a', month: '2026-07', taxable: 1 },
  { empId: 'a', month: '2026-06', taxable: 2 },
  { empId: 'a', month: '2026-05', taxable: 3 },
  { empId: 'b', month: '2026-08', taxable: 9 },
];
eq('賞与月2026-07 → aは2026-06を採用', pickPrevMonthRecords(bonusRecs, '2026-07').get('a')?.taxable, 2);
eq('賞与月2026-07 → b（未来月のみ）は該当なし', pickPrevMonthRecords(bonusRecs, '2026-07').get('b'), undefined);
eq('賞与月2026-05 → aは該当なし', pickPrevMonthRecords(bonusRecs, '2026-05').get('a'), undefined);

// ============ 12. 年収の壁（年度切替） ============
section('12. 年収の壁: 2024年以前と2025年以降の切替');
eq('2024年 → 103万の壁あり', getIncomeWalls(2024).map(w => w.threshold),
   [1030000, 1060000, 1300000, 1500000, 2010000]);
eq('2025年 → 123万・160万に変更', getIncomeWalls(2025).map(w => w.threshold),
   [1060000, 1230000, 1300000, 1600000, 2010000]);
eq('2026年も改正後', getIncomeWalls(2026).some(w => w.threshold === 1230000), true);

// ============ 13. マイカー通勤の距離段階 + 標準報酬の通勤手当込み判定 ============
section('13. マイカー通勤の距離段階非課税限度額（施行令20条の2）');
eq('片道1km → 全額課税', carCommuteCap(1, '2026-07'), 0);
eq('片道9km → 4,200円', carCommuteCap(9, '2026-07'), 4200);
eq('片道12km → 7,300円（令和7年改正後）', carCommuteCap(12, '2026-07'), 7300);
eq('片道12km 2025-03支払分 → 旧額7,100円', carCommuteCap(12, '2025-03'), 7100);
eq('片道60km 2025-06 → 38,700円（55km以上）', carCommuteCap(60, '2025-06'), 38700);
eq('片道100km 2025-06 → 65km以上区分なし=38,700円', carCommuteCap(100, '2025-06'), 38700);
eq('片道100km 2026-07 → 95km以上=66,400円', carCommuteCap(100, '2026-07'), 66400);
eq('距離指定ありの分離: 2万円・12km', splitCommuteAllowance(20000, false, 12, '2026-07').nonTaxable, 7300);
eq('距離未入力は従来31,600円上限', splitCommuteAllowance(50000, false, null, '2026-07').nonTaxable, 31600);
eq('距離未入力フラグ（注記用）', splitCommuteAllowance(50000, false, null, '2026-07').distanceUnknown, true);
eq('手当0円なら距離未入力でも注記しない', splitCommuteAllowance(0, false, null, '2026-07').distanceUnknown, false);
// 標準報酬の自動判定は 基本給+諸手当+通勤手当（総額）で行う
const c5 = calcMonthlyPaycheck(emp2, { month: '2026-07', rates: rates8 });
eq('標準報酬の自動判定は通勤手当込み（30万+1.5万→標報32万）', c5.stdRemuneration, 320000);
const c6 = calcMonthlyPaycheck(emp1, { month: '2026-07', allowance: 20000, rates: rates8 });
eq('標準報酬の自動判定は諸手当込み（30万+2万→標報32万）', c6.stdRemuneration, 320000);

// ============ 14. 標準報酬「自動」基準の統一ヘルパー ============
section('14. autoStdBase: 標準報酬の自動判定基準（3画面統一）');
eq('月給30万+通勤1.5万 → 31.5万', autoStdBase({ type: 'regular', monthlySalary: 300000, commuteAllowanceMonthly: 15000 }), 315000);
eq('時給1,200×基準時間未設定(160h既定) → 19.2万', autoStdBase({ type: 'arbeit', hourlyWage: 1200 }), 192000);
eq('時給1,200×100h+通勤5,000 → 12.5万', autoStdBase({ type: 'arbeit', hourlyWage: 1200, baseHours: 100, commuteAllowanceMonthly: 5000 }), 125000);
eq('等級化はcalc.jsの自動判定と一致（月給30万+通勤1.5万→標報32万）',
   getHealthStandard(autoStdBase({ type: 'regular', monthlySalary: 300000, commuteAllowanceMonthly: 15000 })),
   calcMonthlyPaycheck({ ...emp2 }, { month: '2026-07', rates: rates8 }).stdRemuneration);

// ============ 15. 全銀カナ正規化 ============
section('15. zenginKana: 全銀フォーマット向けカナ正規化');
eq('ひらがな→半角カナ', zenginKana('やまだ たろう'), 'ﾔﾏﾀﾞ ﾀﾛｳ');
eq('ヰ・ヱ・ヺの変換', zenginKana('ヰヱヺ'), 'ｲｴｦﾞ');
eq('ゐ・ゑ（ひらがな経由）', zenginKana('ゐゑ'), 'ｲｴ');
eq('結合濁点 U+3099', zenginKana('ガ'), 'ｶﾞ');
eq('結合半濁点 U+309A', zenginKana('パ'), 'ﾊﾟ');

// ============ 結果 ============
const sum = document.createElement('div');
sum.className = 'summary ' + (fail === 0 ? 'ok' : 'bad');
sum.textContent = fail === 0
  ? `✅ 全 ${pass} 件パス`
  : `❌ ${fail} 件失敗 / ${pass} 件パス`;
out.appendChild(sum);
document.title = (fail === 0 ? '✅ ' : '❌ ') + document.title;
</script>
